<!DOCTYPE html>

<head>
	<meta charset="UTF-8" />

	<title>Email Signature</title>
	<style>
		/* Outlook desktop may show static fallback only; modern clients animate this block. */
		@keyframes hammerSwing {
			0% {
				transform: scaleX(-1) rotate(-32deg) translate(0, 0);
			}
			35% {
				transform: scaleX(-1) rotate(-0deg) translate(0, 0);
			}
			44% {
				transform: scaleX(-1) rotate(0deg) translate(-0px, 0px);
			}
			55% {
				transform: scaleX(-1) rotate(-0deg) translate(-0px, 0px);
			}
			100% {
				transform: scaleX(-1) rotate(-0deg) translate(0, 0);
			}
		}

		@keyframes nailHit {
			0% {
				transform: translateY(6px);
			}
			40% {
				transform: translateY(0);
			}
			45% {
				transform: translateY(0px);
			}
			52% {
				transform: translateY(0);
			}
			100% {
				transform: translateY(0);
			}
		}

		@keyframes impactFlash {
			0% {
				opacity: 1;
				transform: scale(1);
			}
			43% {
				opacity: 0;
				transform: scale(0.7);
			}
			46% {
				opacity: 0;
				transform: scale(1);
			}
			60% {
				opacity: 0;
				transform: scale(1.1);
			}
			100% {
				opacity: 0;
				transform: scale(0.7);
			}
		}

		.hammer-nail-wrap {
			display: inline-block;
			position: relative;
			width: 148px;
			height: 78px;
			vertical-align: middle;
			margin-right: 0;
			font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
		}

		.hammer {
			display: inline-block;
			position: absolute;
			left: 10px;
			top: 0px;
			font-size: 56px;
			line-height: 1;
			transform-origin: 70% 85%;
			animation: hammerSwing 1.2s infinite;
		}

		.nail {
			display: inline-block;
			position: absolute;
			right: 30px;
			top: 50px;
			width: 22px;
			height: 40px;
			animation: nailHit 1.2s infinite;
		}

		.nail-head {
			display: block;
			width: 18px;
			height: 8px;
			margin: 0 auto;
			background: #94a3b8;
			border-radius: 8px;
		}

		.nail-shaft {
			display: block;
			width: 6px;
			height: 26px;
			margin: 0 auto;
			background: #cbd5e1;
			border-radius: 3px;
		}

		.impact {
			display: inline-block;
			position: absolute;
			right: 34px;
			top: 34px;
			font-size: 18px;
			line-height: 1;
			opacity: 0;
			animation: impactFlash 1.2s infinite;
		}

		@media (prefers-reduced-motion: reduce) {
			.hammer,
			.nail,
			.impact {
				animation: none !important;
			}
		}
	</style>
</head>
